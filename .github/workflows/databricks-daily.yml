name: Databricks daily finished matches

on:
  schedule:
    # 00:00 Asia/Dhaka (UTC+6). GitHub schedules are UTC.
    - cron: "0 18 * * *"
  workflow_dispatch:

concurrency:
  group: databricks-recent
  cancel-in-progress: false

jobs:
  sync:
    name: Store new finished matches
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r scripts/requirements-databricks.txt

      - name: Store new finished matches in cricsocc.bronze
        env:
          PYTHONUNBUFFERED: "1"
          DATABRICKS_SERVER_HOSTNAME: dbc-7c1ae9c0-80c4.cloud.databricks.com
          DATABRICKS_HTTP_PATH: /sql/1.0/warehouses/5f957263edb1a1ef
          DATABRICKS_TOKEN: ${{ secrets.DATABRICKS_TOKEN }}
        run: python scripts/databricks_sync.py
